<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./smile.png">
    <title>Contact Me</title>
</head>

<body>

    <header style="text-align: center;">
        <h1>Contact Me</h1>
    </header>

    <hr>

    <main>
        <p style="text-align: center;">Feel free to reach out to me for project inquiries or collaborations.</p>

        <form action="#" method="post" style="max-width: 500px; margin: 0 auto;">
            
            <label for="name"><strong>Name:</strong></label><br>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required style="width: 100%;"><br><br>

            <label for="email"><strong>Email:</strong></label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required style="width: 100%;"><br><br>

            <label for="subject"><strong>Subject:</strong></label><br>
            <input type="text" id="subject" name="subject" placeholder="Enter topic" required style="width: 100%;"><br><br>

            <label for="message"><strong>Message:</strong></label><br>
            <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required style="width: 100%;"></textarea><br><br>

            <input type="submit" value="Send Message">
            <input type="reset" value="Clear Form">

        </form>
    </main>

    <br><br>

    <div style="text-align: center;">
        <a href="./index.html">
            <button>⬅ Back to Home</button>
        </a>
    </div>

</body>

</html>
